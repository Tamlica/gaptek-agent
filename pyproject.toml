[project]
name = "gaptek-agent"
version = "0.1.0"
description = "Usability QA tool that simulates a non-technical Indonesian user"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic>=2.8.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "openai>=3.55.0",
    "playwright>=1.65.2",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaptek"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option in defaults is the Typer idiom

[tool.ruff.lint.per-file-ignores]
"src/gaptek/perception/extract.py" = ["E501"]  # embedded JS

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
gaptek = "gaptek.cli:app"
gaptek-mcp = "gaptek.mcp_server:main"
